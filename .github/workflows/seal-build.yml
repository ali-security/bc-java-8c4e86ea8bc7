name: seal-build

# Builds the bcprov-jdk15to18 jar the way the public release was produced: Ant 1.6.5 on JDK 8u402
# (manifest Ant-Version / Originally-Created-By), javac -source/-target 1.5 without debug info,
# Pack200 repack (upstream's pack200.enabled path in ant/bc+-build.xml), then build1-5to1-8's
# META-INF/services injection. The test suite runs on Travis (.travis.yml).
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8.0.402'

      - name: Install Ant 1.6.5
        run: |
          curl -fsSL --retry 5 https://archive.apache.org/dist/ant/binaries/apache-ant-1.6.5-bin.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-ant-1.6.5/bin" >> "$GITHUB_PATH"
          # the runner exports ANT_HOME for its preinstalled Ant 1.10, which the 1.6.5 launcher would load
          echo "ANT_HOME=$RUNNER_TEMP/apache-ant-1.6.5" >> "$GITHUB_ENV"

      - name: Build bcprov-jdk15to18 jar
        run: |
          ant -version
          java -version
          ant -Drelease.debug=false -f ant/jdk15+.xml build-provider
          cd build/artifacts/jdk1.5/jars
          pack200 --repack --segment-limit=-1 bcprov-jdk15to18-17801.jar
          jar uf bcprov-jdk15to18-17801.jar -C "$GITHUB_WORKSPACE/prov/src/main/resources" META-INF
          mkdir -p "$GITHUB_WORKSPACE/seal-out"
          cp bcprov-jdk15to18-17801.jar "$GITHUB_WORKSPACE/seal-out/bcprov-jdk15to18-1.78.1.jar"
          ls -l "$GITHUB_WORKSPACE/seal-out"

      - uses: actions/upload-artifact@v4
        with:
          name: bcprov-jdk15to18-jar
          path: seal-out/bcprov-jdk15to18-1.78.1.jar
          if-no-files-found: error
